services:
  docs:
    image: brewgis_docs
    container_name: brewgis_docs
    build:
      context: .
      dockerfile: ./compose/docs/Dockerfile
    env_file:
      - ./.envs/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./brewgis:/app/brewgis:z
    ports:
      - '9000:9000'
    command: /start-docs
