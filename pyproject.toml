[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brewgis"
version = "0.1.0"
description = "GIS Workspace for Urban Planners and Data Scientists"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Brew GIS Contributors" },
]
dependencies = [
    "argon2-cffi==23.1.0",
    "basedpyright>=1.39",
    "celery==5.4.0",
    "cmap==0.7.2",
    "coverage==7.6.8",
    "crispy-bootstrap5==2026.3",

    "deal>=4.24",
    "django>=6.0,<6.1",
    "django-allauth[mfa]==65.16.0",
    "django-anymail==15.0",
    "django-celery-beat==2.9.0",
    "django-template-lsp>=1.2,<2.0",
    "django-coverage-plugin==3.1.0",
    "django-crispy-forms==2.6",
    "django-debug-toolbar==6.2.0",
    "django-environ==0.11.2",
    "django-htmx==1.27.0",
    "django-model-utils==5.0.0",
    "django-ninja==1.6.2",
    "django-redis==6.0.0",
    "django-stubs==6.0.3",
    "djlint==1.36.1",
    "dlt[postgres]>=1.0,<2.0",
    "factory-boy==3.3.1",
    "flower==2.0.1",
    "geoalchemy2==0.20.0",
    "geopandas[all]==1.0.1",
    "gunicorn==23.0.0",
    "hiredis==3.0.0",
    "hypothesis>=6.100",
    "ipdb==0.13.13",
    "jupysql>=0.10,<1.0",
    "mcp>=1.0.0",
    "numpy>=2.0,<3.0",
    "pandas==2.2.3",
    "pandas-stubs==2.2.3.241009",
    "pillow==12.3.0",
    "playwright==1.52.0",
    "polars[lazy,pyarrow]>=1.0,<2.0",
    "pre-commit==4.0.1",
    "psycopg2==2.9.10",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.3",
    "pytest==8.3.3",
    "pytest-bdd==8.1.0",
    "pytest-django==4.9.0",
    "pytest-playwright==0.7.0",
    "pytest-sugar==1.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6,<4.0",
    "pytestarch>=4.0,<5.0",
    "python-slugify==8.0.4",
    "rasterio>=1.3,<2.0",
    "redis==5.2.0",
    "ruff>=0.15.13",
    "ruffian>=0.10",
    "sphinx==8.1.3",
    "sphinx-autobuild==2024.10.3",
    "statsmodels>=0.14,<1.0",
    "watchfiles==1.0.0",
    "weasyprint>=62,<71",
    "werkzeug[watchdog]==3.1.3",
    "whitenoise==6.8.2",
]

[tool.setuptools.packages.find]
include = ["brewgis", "brewgis.*", "config", "config.*"]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=brewgis.config.settings --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
    "*_steps.py",
]
norecursedirs = [
    "planning",
    "brewgis/sqlmesh/tests",
    # Pre-dbt->SQLMesh-migration BDD suite (see commit db21d4b): its steps
    # module references tests/features/dbt_isolation.feature, which no
    # longer exists, so pytest can't even collect it — breaks `make test`
    # for every invocation until this is either restored or deleted outright.
    "tests/isolation_orchestration",
]
markers = [
    "e2e: mark test as end-to-end test requiring Playwright browser",
    "slow: mark test as slow (property-based, hypothesis-generated)",
    "models: database model tests",
    "views: view/HTTP tests",
    "integration: tests requiring full Docker stack (PostGIS or external services)",
    "live_stack: integration tests needing the stack running (server, tile containers, browser) — excluded from test-integration",
    "timeout: mark test with per-test timeout for pytest-timeout",
    "review: UX design review tests (macro-level UX validation, not pixel/CSS checks)",
]
timeout = 300
timeout_func_only = true

# ==== Coverage ====
[tool.coverage.run]
include = ["brewgis/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pycodestyle]
max-line-length = 119
max-doc-length = 119
[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "ANN", # flake8-annotations
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  "FURB",
  "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "ANN401", # Dynamically typed expressions are acceptable for pytest fixtures and gradual typing
  "COM812", # Trailing comma — handled by ruff formatter
]

[tool.ruff.lint.per-file-ignores]
# cookiecutter-generated files — keep blanket noqa
"config/urls.py" = ["PGH004"]
"config/wsgi.py" = ["PGH004"]
"docs/conf.py" = ["PGH004"]
"manage.py" = ["PGH004"]
"merge_production_dotenvs_in_dotenv.py" = ["PGH004"]
# Standard pytest fixture patterns
"brewgis/conftest.py" = ["ANN001", "ARG001"]

"tests/**/*.py" = ["PLR2004", "ANN001", "ARG001"]
[tool.ruff.lint.isort]
force-single-line = true

# ==== basedpyright (type checking) ====

# basedpyright is a pyright fork (TypeScript, shipped as the `basedpyright`
# PyPI package) and replaces mypy here: it reads the same django-stubs `.pyi`
# files, but checks all of `brewgis/` in ~10s instead of hours.
# Install: pip install basedpyright
# Run:     make typecheck
#
# The two disabled rules below are the ones only mypy's django-stubs *plugin*
# can satisfy. pyright reads django-stubs' static stubs but cannot run that
# plugin, so these report false positives on anything Django's metaprogramming
# creates: reverse FK/M2M accessors (`layer.symbology`), `Manager[User]`
# methods injected by django_stubs_ext, CBV class attributes (`template_name`),
# and SQLMesh's decorator API (`from sqlmesh import model, macro, audit`).
[tool.basedpyright]
include = ["brewgis"]
typeCheckingMode = "standard"
# Only trust libraries that ship types (py.typed or a stub package). With this
# on, pyright type-checks the source of *untyped* dependencies (django-environ's
# unannotated `default=NOTSET`, geopandas' internal DataFrame helpers, ...) and
# reports their false positives against our call sites — the equivalent of the
# `ignore_missing_imports`/`ignore_errors` overrides the old mypy config carried.
useLibraryCodeForTypes = false
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnusedCallResult = "none"
reportUnnecessaryTypeIgnoreComment = "none"
reportMissingTypeStubs = "none"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "none"
reportIncompatibleVariableOverride = "none"
executionEnvironments = [{ root = "brewgis", extraPaths = ["."] }]

# ==== Vulture (dead code detection) ====
[tool.vulture]
paths = ["brewgis"]
exclude = [
    "*/migrations/*",
]
ignore_names = [
    "app_name",
    "objects",
    "urlpatterns",
    "Meta",
    "__all__",
    "Command",
    "defs",
]
ignore_decorators = [
    "@shared_task",
    "@admin.register",
    "@asset",
    "@pytest.fixture",
    "@tool",
]
min_confidence = 60
sort_by_size = true

# ==== ruffian (custom rules plugin runner) ====
[tool.ruffian]

[[tool.ruffian.plugins]]
name = "brewgis-antipatterns"
executable = "brewgis/_ruff_rules/check.py"
config = {}
