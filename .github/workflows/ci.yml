name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DEAL_SEED: ${{ github.run_id }}

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit (skip mypy — needs Docker infra)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements/*.txt', 'compose/**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # docker-compose.yml's `env_file:` list always includes ./.env — it's
      # gitignored (real installs copy .env.example -> .env, see README).
      # The django/postgres passwords in .env.example are dev-only fakes
      # scoped to this disposable container network, not real secrets.
      #
      # docker-compose.yml runs the django container as `${UID:-1000}:${GID:-1000}`
      # so it can write into the bind-mounted repo without root. Locally that
      # matches most devs' UID. On the GitHub-hosted runner, the checkout is
      # owned by the runner user (uid 1001), not 1000, so without this the
      # container can't create new files/dirs under the mount (e.g. test
      # screenshot output) and fails with PermissionError. Writing UID/GID
      # into .env (read directly by docker compose) sidesteps bash's
      # readonly $UID builtin.
      #
      # `./cache` is gitignored, so it doesn't exist on a fresh checkout.
      # docker compose would auto-create it as root on first mount, which
      # the non-root container user then can't write into (PermissionError
      # under /home/dev-user/.cache) — create it ourselves first so it's
      # owned by the runner user instead.
      - name: Create local env file
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          mkdir -p cache

      - name: Build the Stack
        run: docker compose -f docker-compose.yml build django
        env:
          BUILDKIT_PROGRESS: plain

      - name: Build the docs
        run: docker compose -f docker-compose.docs.yml build docs

      - name: Check DB Migrations
        run: make check-migrations

      - name: Run DB Migrations
        run: make migrate

      #- name: Run type check
      #  run: make typecheck

      - name: Run test suite (excludes e2e and integration)
        run: make test

      - name: Run SQLMesh model tests + lint
        run: make test-sqlmesh

      - name: Tear down the Stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking for now: the e2e suite has pre-existing failures
    # unrelated to most day-to-day changes (a live_server threading issue
    # hitting the real login view — see git history around 2026-09-13/14).
    # Flip this to a hard gate once that's fixed.
    continue-on-error: true
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create local env file
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          mkdir -p cache

      - name: Build the Stack
        run: docker compose -f docker-compose.yml build django

      - name: Run DB Migrations
        run: make migrate

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 7

      - name: Tear down the Stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
