name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DEAL_SEED: ${{ github.run_id }}

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      # Consider using pre-commit.ci for open source project
      - name: Run pre-commit (skip mypy — needs Docker infra)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements/*.txt', 'compose/**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # docker-compose.yml's `env_file:` list always includes ./.env — it's
      # gitignored (real installs copy .env.example -> .env, see README).
      # The django/postgres passwords in .env.example are dev-only fakes
      # scoped to this disposable container network, not real secrets.
      #
      # docker-compose.yml runs the django container as `${UID:-1000}:${GID:-1000}`
      # so it can write into the bind-mounted repo without root. Locally that
      # matches most devs' UID. On the GitHub-hosted runner, the checkout is
      # owned by the runner user (uid 1001), not 1000, so without this the
      # container can't create new files/dirs under the mount (e.g. test
      # screenshot output) and fails with PermissionError. Writing UID/GID
      # into .env (read directly by docker compose) sidesteps bash's
      # readonly $UID builtin.
      #
      # `./cache` is gitignored, so it doesn't exist on a fresh checkout.
      # docker compose would auto-create it as root on first mount, which
      # the non-root container user then can't write into (PermissionError
      # under /home/dev-user/.cache) — create it ourselves first so it's
      # owned by the runner user instead.
      - name: Create local env file
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          mkdir -p cache

      - name: Build the Stack
        run: docker compose -f docker-compose.yml build django
        env:
          BUILDKIT_PROGRESS: plain

      - name: Build the docs
        run: docker compose -f docker-compose.docs.yml build docs

      - name: Check DB Migrations
        run: make check-migrations

      - name: Run DB Migrations
        run: make migrate

      #- name: Run type check
      #  run: make typecheck

      - name: Run test suite (excludes e2e and integration)
        run: make test

      # The integration tests that need only Postgres/PostGIS (the stack's
      # database, not its server or tile containers) — `make test` deselects
      # them, which is how a broken pipeline step and a stale canvas-view
      # assertion stayed green. `make test-live-stack` (a running server,
      # Martin/tipg and a browser) is still run by hand.
      - name: Run integration tests (PostGIS)
        run: make test-integration

      - name: Run SQLMesh model tests + lint
        run: make test-sqlmesh

      - name: Tear down the Stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create local env file
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          mkdir -p cache

      - name: Build the Stack
        run: docker compose -f docker-compose.yml build django

      - name: Run DB Migrations
        run: make migrate

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 7

      - name: Tear down the Stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # The three tests that need a *running* stack rather than a test database:
  # an alternative scenario's canvas view tiled by Martin, a real MapLibre
  # render after painting (twice, to compare tipg's pixels against Martin's),
  # and a real (non-eager) Celery paint task in between. They are excluded from
  # `make test` and `make test-integration` by the live_stack marker.
  #
  # They cannot use pytest-django's test database: Martin and tipg read the dev
  # database directly, so the fixtures go through psycopg and the browser talks
  # to the compose stack's own dev server on :8000 — hence `exec` into the
  # running django container rather than `run --rm`. Restarting tipg/Martin to
  # re-discover a freshly created fixture table goes through the docker socket
  # docker-compose.yml already mounts into that container.
  #
  # continue-on-error until this job has a green history on CI: everything it
  # needs exists here (the stack, the socket, Chromium, a Celery worker), but a
  # gate that has never run in this environment is worth watching before it is
  # allowed to block other people's pull requests.
  live-stack:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create local env file
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          mkdir -p cache

      - name: Build the Stack
        run: docker compose -f docker-compose.yml build django

      - name: Start the Stack
        run: |
          docker compose -f docker-compose.yml up -d \
            postgres redis tipg martin celeryworker django

      - name: Run DB Migrations
        run: make migrate

      - name: Wait for the dev server
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/accounts/login/; then
              exit 0
            fi
            sleep 2
          done
          echo "django dev server never answered on :8000" >&2
          docker compose -f docker-compose.yml logs django | tail -50
          exit 1

      - name: Run live-stack tests (real browser, Martin/tipg, Celery)
        run: make test-live-stack

      - name: Tear down the Stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
