          emp_retail_services: 2.0

      columns: *imputed_columns
  outputs:
    query:
      partial: true
      rows:
        -
          emp_pub: 10.0
          emp_education: 10.0
          emp_ret: 0.0
          emp_retail_services: 0.0
          emp: 10.0

