- name: '"brewgis"."public"."sacog_assessor_parcels_raw"'
  description: Sacramento County assessor parcel extract, one row per parcel with the land use code and zoning.
  column_descriptions:
    apn: Assessor parcel number (APN) of the parcel.
    landuse: County assessor land use code of the parcel, the official land use classification.
    zone: County zoning code of the parcel.
    lotsize: Lot size recorded by the assessor for the parcel (sq ft).
    jurisdiction: Jurisdiction (city or county) the parcel lies in.
    shape: ArcGIS SHAPE field retained from the raw assessor extract (numeric; the boundary is in geometry).
    geometry: Parcel boundary geometry as written by the assessor loader (EPSG:4326).
  columns:
    apn: TEXT
    landuse: TEXT
    zone: TEXT
    lotsize: DOUBLE PRECISION
    jurisdiction: TEXT
    SHAPE: DOUBLE PRECISION
    geometry: GEOMETRY(GEOMETRY, 4326)
  gateway: postgis
- name: '"brewgis"."public"."sacog_assessor_sales_raw"'
  description: Sacramento County assessor sales extract, one row per sold parcel with building size and age.
  column_descriptions:
    apn: Assessor parcel number (APN) of the sold parcel.
    living_area: Total living area of the building on the parcel (sq ft; ArcGIS TOTAL_LIVING_AREA).
    building_sf: Total building square footage of the parcel (sq ft; ArcGIS BUILDING_SF).
    year_built: Effective year built of the building (year; ArcGIS EFFECTIVE_YEAR_BUILT).
    stories: Number of stories of the building (ArcGIS NUMBER_OF_STORIES).
    bedrooms: Number of bedrooms in the building (ArcGIS NUMBER_OF_BEDROOMS).
    baths: Number of bathrooms in the building (ArcGIS NUMBER_OF_BATHS).
    ground_floor_gross: Gross ground floor area of the building (sq ft; ArcGIS GROUND_FLOOR_GROSS).
    land_use_code: Assessor land use code recorded on the sale (ArcGIS LAND_USE_CODE).
    property_type: Property type recorded by the assessor for the sale (ArcGIS Property_Type).
    sales_price: Indicated sale price of the transaction (ArcGIS INDICATED_SALES_PRICE; stored as text).
    lot_size_acres: Lot size of the parcel at the time of sale (acres; ArcGIS LOT_SIZE_ACRES).
    units: Number of building units recorded by the assessor (ArcGIS Units).
    shape: ArcGIS Shape field retained from the raw sales extract (numeric; the boundary is in geometry).
    geometry: Parcel boundary geometry of the sold parcel as written by the assessor loader (EPSG:4326).
  columns:
    apn: TEXT
    living_area: DOUBLE PRECISION
    building_sf: DOUBLE PRECISION
    year_built: DOUBLE PRECISION
    stories: DOUBLE PRECISION
    bedrooms: DOUBLE PRECISION
    baths: DOUBLE PRECISION
    ground_floor_gross: DOUBLE PRECISION
    land_use_code: TEXT
    property_type: TEXT
    sales_price: TEXT
    lot_size_acres: DOUBLE PRECISION
    units: DOUBLE PRECISION
    Shape: DOUBLE PRECISION
    geometry: GEOMETRY(GEOMETRY, 4326)
  gateway: postgis
