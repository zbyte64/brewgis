    cns19: 'LODES WAC segment CNS19 jobs in the block: state government.'
    cns20: 'LODES WAC segment CNS20 jobs in the block: local government.'
    ca01: Jobs for workers age 29 or younger (jobs).
    ca02: Jobs for workers age 30 to 54 (jobs).
    ca03: Jobs for workers age 55 or older (jobs).
    ce01: Jobs with earnings of 1250 dollars per month or less (jobs).
    ce02: Jobs with earnings of 1251 to 3333 dollars per month (jobs).
    ce03: Jobs with earnings above 3333 dollars per month (jobs).
    cr01: Jobs held by workers of White race alone (jobs).
    cr02: Jobs held by workers of Black or African American race alone (jobs).
    cr03: Jobs held by workers of American Indian or Alaska Native race alone (jobs).
    cr04: Jobs held by workers of Asian race alone (jobs).
    cr05: Jobs held by workers of Native Hawaiian or Other Pacific Islander race alone (jobs).
    cr07: Jobs held by workers of two or more race groups (jobs).
    ct01: Jobs held by workers who are not Hispanic or Latino (jobs).
    ct02: Jobs held by Hispanic or Latino workers (jobs).
    cd01: Jobs held by workers aged 30 and over with less than a high school education (jobs).
    cd02: Jobs held by workers aged 30 and over with a high school diploma and no college (jobs).
    cd03: Jobs held by workers aged 30 and over with some college or an associate degree (jobs).
    cd04: Jobs held by workers aged 30 and over with a bachelor or higher degree (jobs).
    cs01: Jobs held by male workers (jobs).
    cs02: Jobs held by female workers (jobs).
    cfa01: Jobs at firms aged 0 to 1 years (jobs).
    cfa02: Jobs at firms aged 2 to 3 years (jobs).
    cfa03: Jobs at firms aged 4 to 5 years (jobs).
    cfa04: Jobs at firms aged 6 to 10 years (jobs).
    cfa05: Jobs at firms aged 11 or more years (jobs).
    cfs01: Jobs at firms with 0 to 19 employees (jobs).
    cfs02: Jobs at firms with 20 to 49 employees (jobs).
    cfs03: Jobs at firms with 50 to 249 employees (jobs).
    cfs04: Jobs at firms with 250 to 499 employees (jobs).
    cfs05: Jobs at firms with 500 or more employees (jobs).
    createdate: Date the source LODES file was created (YYYYMMDD text).
    _dlt_load_id: dlt load identifier of the batch that loaded the row.
    _dlt_id: dlt-generated unique identifier of the loaded row.
