- name: '"brewgis"."public"."nlcd_raster"'
  description: NLCD land-cover raster tiles (DuckDB-loaded) used for parcel-level land-cover statistics.
  column_descriptions:
    rid: Raster tile identifier (PostGIS raster primary key).
    rast: PostGIS raster tile holding NLCD land-cover classes.
  columns:
    rid: INT
    rast: raster
  gateway: postgis
- name: '"brewgis"."public"."nlcd_tree_canopy_raster"'
  description: NLCD tree-canopy raster tiles (DuckDB-loaded) used for parcel-level tree-canopy statistics.
  column_descriptions:
    rid: Raster tile identifier (PostGIS raster primary key).
    rast: PostGIS raster tile holding NLCD tree-canopy percent values.
  columns:
    rid: INT
    rast: raster
  gateway: postgis
- name: '"brewgis"."public"."sac_cnty_region_base_canvas"'
  description: SACOG v1 reference base canvas (2015 vintage), one row per parcel with acreage, population and jobs.
  column_descriptions:
    geography_id: Integer identifier of the parcel record in the SACOG v1 reference base canvas.
    source_id: External parcel identifier from the SACOG v1 source data.
    wkb_geometry: Parcel boundary geometry stored in the SACOG v1 PostGIS wkb_geometry column.
    region_lu_code: SACOG v1 region land use code of the parcel; a region-specific code with no brewgis equivalent.
    built_form_key: Built form classification key of the parcel, referencing the SACOG v1 built form definitions.
    acres_developable: Developable acreage of the parcel after environmental constraint discounts (acres).
    developable_proportion: Ratio of developable acres to gross acres of the parcel (0-1).
    land_development_category: Land development category of the parcel (urban, compact, standard or rural).
    intersection_density_sqmi: Intersection density around the parcel (intersections per square mile).
    sqft_parcel: Parcel area in the SACOG v1 reference data (sq ft).
    acres_gross: Gross area of the parcel (acres).
    acres_parcel: Net parcel area of the parcel (acres).
    acres_parcel_res: Total residential parcel area (acres).
    acres_parcel_emp: Total employment parcel area (acres).
    acres_parcel_mixed_use: Mixed use parcel area (acres).
    acres_parcel_no_use: No use parcel area (acres).
    pop: Total population of the parcel (people).
    hh: Households on the parcel (count).
    du: Dwelling units on the parcel (count).
    du_detsf: Detached single family dwelling units on the parcel (count).
    du_attsf: Attached single family dwelling units on the parcel (count).
    du_mf: Multi-family dwelling units on the parcel (count).
    emp: Total employment on the parcel (jobs).
    emp_ret: Retail employment on the parcel, the sum of the five retail services subtypes (jobs).
    emp_off: Office employment on the parcel, office services plus medical services (jobs).
    emp_pub: Public employment on the parcel, public administration plus education (jobs).
    emp_ind: Industrial employment on the parcel, the sum of the seven industrial subtypes (jobs).
    emp_ag: Agricultural employment on the parcel, agriculture plus extraction (jobs).
    emp_military: Military employment on the parcel (jobs).
    du_detsf_ll: Detached single family large lot dwelling units on the parcel (count).
    du_detsf_sl: Detached single family small lot dwelling units on the parcel (count).
    du_mf2to4: Multi-family 2 to 4 unit dwelling units on the parcel (count).
    du_mf5p: Multi-family 5 or more unit dwelling units on the parcel (count).
    emp_retail_services: Retail services employment on the parcel (jobs; NAICS 44-45).
    emp_restaurant: Restaurant employment on the parcel (jobs; NAICS 722).
    emp_accommodation: Accommodation employment on the parcel (jobs; NAICS 721).
    emp_arts_entertainment: Arts and entertainment employment on the parcel (jobs; NAICS 71).
    emp_other_services: Other services employment on the parcel (jobs; NAICS 81).
    emp_office_services: Office services employment on the parcel (jobs; NAICS 51-56).
    emp_public_admin: Public administration employment on the parcel (jobs; NAICS 92).
    emp_education: Education employment on the parcel (jobs; NAICS 61).
    emp_medical_services: Medical services employment on the parcel (jobs; NAICS 62).
    emp_manufacturing: Manufacturing employment on the parcel (jobs; NAICS 31-33).
    emp_wholesale: Wholesale employment on the parcel (jobs; NAICS 42).
    emp_transport_warehousing: Transport and warehousing employment on the parcel (jobs; NAICS 48-49).
    emp_utilities: Utilities employment on the parcel (jobs; NAICS 22).
    emp_construction: Construction employment on the parcel (jobs; NAICS 23).
    emp_agriculture: Agriculture employment on the parcel (jobs; NAICS 11).
    emp_extraction: Extraction employment on the parcel (jobs; NAICS 21).
    bldg_sqft_detsf_sl: Detached single family small lot building area on the parcel (sq ft).
    bldg_sqft_detsf_ll: Detached single family large lot building area on the parcel (sq ft).
    bldg_sqft_attsf: Attached single family building area on the parcel (sq ft).
    bldg_sqft_mf: Multi-family building area on the parcel (sq ft).
    bldg_sqft_retail_services: Retail services building area on the parcel (sq ft).
    bldg_sqft_restaurant: Restaurant building area on the parcel (sq ft).
    bldg_sqft_accommodation: Accommodation building area on the parcel (sq ft).
    bldg_sqft_arts_entertainment: Arts and entertainment building area on the parcel (sq ft).
    bldg_sqft_other_services: Other services building area on the parcel (sq ft).
    bldg_sqft_office_services: Office services building area on the parcel (sq ft).
    bldg_sqft_public_admin: Public administration building area on the parcel (sq ft).
    bldg_sqft_education: Education building area on the parcel (sq ft).
    bldg_sqft_medical_services: Medical services building area on the parcel (sq ft).
    bldg_sqft_transport_warehousing: Transport and warehousing building area on the parcel (sq ft).
    bldg_sqft_wholesale: Wholesale building area on the parcel (sq ft).
    acres_parcel_res_detsf: Detached single family residential parcel area (acres).
    acres_parcel_res_detsf_sl: Detached single family small lot residential parcel area (acres).
    acres_parcel_res_detsf_ll: Detached single family large lot residential parcel area (acres).
    acres_parcel_res_attsf: Attached single family residential parcel area (acres).
    acres_parcel_res_mf: Multi-family residential parcel area (acres).
    acres_parcel_emp_ret: Retail employment parcel area (acres).
    acres_parcel_emp_off: Office employment parcel area (acres).
    acres_parcel_emp_pub: Public employment parcel area (acres).
    acres_parcel_emp_ind: Industrial employment parcel area (acres).
    acres_parcel_emp_ag: Agricultural employment parcel area (acres).
    acres_parcel_emp_military: Military employment parcel area (acres).
    residential_irrigated_sqft: Residential irrigated area on the parcel (sq ft).
    commercial_irrigated_sqft: Commercial irrigated area on the parcel (sq ft).
    created: Timestamp when the reference base canvas row was created.
    updated: Timestamp when the reference base canvas row was last updated.
    dev_pct: Share of developable acres developed on the parcel in the reference scenario (% as 0-100).
    density_pct: Density adjustment applied to the built form after the gross-to-net step (% as 0-100).
    gross_net_pct: Gross-to-net acreage ratio of the parcel, adjusting for roads and infrastructure (% as 0-100).
    dirty_flag: Whether the feature has been modified since the last analysis run (boolean).
    jurisdiction: Jurisdiction (city or county) the parcel lies in.
    county: County name the parcel lies in.
    clear_flag: Whether existing development is cleared before the new built form is applied (boolean).
  columns:
    geography_id: INT
    source_id: VARCHAR
    wkb_geometry: GEOMETRY
    region_lu_code: VARCHAR(200)
    built_form_key: VARCHAR(200)
    acres_developable: DECIMAL(14, 4)
    developable_proportion: DECIMAL(8, 4)
    land_development_category: VARCHAR(50)
    intersection_density_sqmi: DECIMAL(14, 4)
    sqft_parcel: DECIMAL(14, 4)
    acres_gross: DECIMAL(14, 4)
    acres_parcel: DECIMAL(14, 4)
    acres_parcel_res: DECIMAL(14, 4)
    acres_parcel_emp: DECIMAL(14, 4)
    acres_parcel_mixed_use: DECIMAL(14, 4)
    acres_parcel_no_use: DECIMAL(14, 4)
    pop: DECIMAL(14, 4)
    hh: DECIMAL(14, 4)
    du: DECIMAL(14, 4)
    du_detsf: DECIMAL(14, 4)
    du_attsf: DECIMAL(14, 4)
