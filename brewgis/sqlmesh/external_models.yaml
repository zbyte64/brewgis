    area_parcel_res_attsf: DOUBLE PRECISION
    area_parcel_res_mf: DOUBLE PRECISION
    area_parcel_res: DOUBLE PRECISION
    area_parcel_emp: DOUBLE PRECISION
    area_parcel_emp_ret: DOUBLE PRECISION
    area_parcel_emp_off: DOUBLE PRECISION
    area_parcel_emp_pub: DOUBLE PRECISION
