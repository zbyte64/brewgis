- name: '"brewgis"."public"."sac_cnty_region_existing_land_use_parcels"'
  description: SACOG v1 reference land use parcels, one row per parcel with boundary geometry and land use.
  column_descriptions:
    geography_id: Integer identifier of the parcel in the SACOG v1 parcel layer; join key to the base canvas.
    wkb_geometry: Parcel boundary geometry stored in the SACOG v1 PostGIS wkb_geometry column.
    census_blockgroup: Census block group GEOID of the parcel (12-digit FIPS).
    census_block: Census block GEOID of the parcel (15-digit FIPS).
    land_use: Land use category of the parcel from the SACOG v1 reference layer.
    acres: Parcel area from the SACOG v1 reference layer (acres).
    du: Dwelling units on the parcel from the SACOG v1 reference layer (count).
    jurisdiction: Jurisdiction (city or county) the parcel lies in.
    notes: Free-form notes on the parcel from the SACOG v1 reference layer.
    emp: Total employment on the parcel from the SACOG v1 reference layer (jobs).
    ret: Retail employment on the parcel from the SACOG v1 reference layer (jobs).
    off: Office employment on the parcel from the SACOG v1 reference layer (jobs).
    pub: Public employment on the parcel from the SACOG v1 reference layer (jobs).
    ind: Industrial employment on the parcel from the SACOG v1 reference layer (jobs).
    other: Employment in other sectors on the parcel from the SACOG v1 reference layer (jobs).
    assessor: Assessor use code of the parcel from the county parcel registry.
    gp: Legacy gp field of the SACOG v1 parcel contract; unused by the brewgis pipeline.
    gluc: Legacy gluc field of the SACOG v1 parcel contract; unused by the brewgis pipeline.
