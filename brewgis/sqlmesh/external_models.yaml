- name: '"brewgis"."public"."census_2020_block_raw"'
  description: Census 2020 PL 94-171 block counts staged in PostGIS, one row per census block.
  column_descriptions:
    geoid: Census block GEOID built from the API state, county, tract and block codes (15-digit FIPS).
    total_population: Total population of the block from the PL 94-171 P1_001N field (people).
    total_housing_units: Total housing units in the block from the PL 94-171 H1_001N field (housing units).
    state: Two-digit state FIPS code returned by the Census API.
    county: Three-digit county FIPS code returned by the Census API.
    _dlt_load_id: dlt load identifier of the batch that loaded the row.
    _dlt_id: dlt-generated unique identifier of the loaded row.
  columns:
    geoid: VARCHAR
    total_population: BIGINT
    total_housing_units: BIGINT
    state: VARCHAR
    county: VARCHAR
    _dlt_load_id: VARCHAR
    _dlt_id: VARCHAR
  gateway: postgis
- name: '"brewgis"."public"."lodes_raw"'
  description: LEHD LODES8 WAC workplace-area characteristics loaded by dlt, one row per census block and year.
  column_descriptions:
    year: LEHD LODES release year of the record.
    w_geocode: 15-digit census block GEOID of the workplace the jobs are reported for.
    c000: LODES C000 total jobs in the block.
    cns01: 'LODES WAC segment CNS01 jobs in the block: goods producing (NAICS 11, 21 and 23).'
    cns02: 'LODES WAC segment CNS02 jobs in the block: manufacturing.'
    cns03: 'LODES WAC segment CNS03 jobs in the block: trade, transport and utilities.'
    cns04: 'LODES WAC segment CNS04 jobs in the block: information.'
    cns05: 'LODES WAC segment CNS05 jobs in the block: finance and insurance.'
    cns06: 'LODES WAC segment CNS06 jobs in the block: real estate.'
