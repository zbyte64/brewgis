{% load i18n %}

<div class="analysis-module-launch-confirm" style="font-size: 0.8rem;">
  <div class="alert alert-success py-2 px-2 mb-3">
    🚀 {% blocktranslate with label=analysis.label scenario=scenario.name %}
      {{ label }} analysis kicked off for scenario "{{ scenario }}". It's running
      in the background — track its progress on its card in the Analysis panel.
    {% endblocktranslate %}
  </div>
  <button type="button"
          class="btn btn-sm btn-outline-secondary"
          x-on:click="$store.panels.closePanel()">{% translate "Close" %}</button>
</div>
