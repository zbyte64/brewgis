{% load i18n crispy_forms_tags %}

<div class="analysis-module-form" style="font-size: 0.8rem;">
  <p class="text-muted mb-3">{{ analysis.description }}</p>
  <form hx-post="{% url 'workspace:analysis_module_launch' workspace.pk analysis.key %}"
        hx-target="#right-panel-content"
        hx-swap="innerHTML"
        hx-disable="find button[type=submit]">
    {# htmx 4 reads hx-disable off the requesting form, so the form names the submit button to disable. #}
    {% csrf_token %}
    {% crispy form %}
    <div class="mt-3 d-flex gap-2">
      <button type="submit"
              class="btn btn-sm btn-primary"
              hx-indicator="#analysis-launch-spinner">{% translate "Run Analysis" %}</button>
      <span id="analysis-launch-spinner"
            class="htmx-indicator spinner-border spinner-border-sm ms-1"></span>
      <button type="button"
              class="btn btn-sm btn-outline-secondary"
              x-on:click="$store.panels.closePanel()">{% translate "Cancel" %}</button>
    </div>
  </form>
</div>
