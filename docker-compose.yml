volumes:
  brewgis_local_postgres_data: {}
  brewgis_local_postgres_data_backups: {}
  brewgis_local_redis_data: {}

x-shared-django: &django
  user: "${UID:-1000}:${GID:-1000}"
  image: brewgis_local_django
  depends_on:
    - postgres
    - redis
    - tipg
  volumes:
    - .:/app:z
    - ./cache:/home/dev-user/.cache/
  env_file:
    - ./.env
    - ./.envs/.local/.django
    - ./.envs/.local/.postgres
  ulimits:
    nproc: 65535
    nofile: 65536
  deploy:
    resources:
      limits:
        cpus: '8'
        memory: 48G
      reservations:
        cpus: '2'
        memory: 1G


services:
  django:
    <<: *django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    container_name: brewgis_local_django
    ports:
      - '8000:8000'
    command: /start
    environment:
      MARTIN_CONTAINER_NAME: brewgis_local_martin
    # Docker socket: lets the app restart the martin container after an
    # analysis run creates new tables, since Martin only discovers tables
    # at process startup (no live-reload API). Scoped to this service only
    # (not celeryworker/mcp/etc.) since AnalysisRun pipelines run
    # synchronously in the Django process — see
    # brewgis/workspace/services/tile_server.py.
    #
    # NOTE: a service-level `volumes:` key REPLACES (not merges with) the
    # `x-shared-django` anchor's own `volumes:` list under YAML `<<:`
    # merge semantics, so the anchor's two mounts are repeated here
    # explicitly rather than silently lost.
    volumes:
      - .:/app:z
      - ./cache:/home/dev-user/.cache/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The container's non-root user needs to be in the host's `docker`
    # group to use the socket mount above. Find your host's GID with:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"

  postgres:
    build:
      context: .
      dockerfile: ./compose/local/postgres/Dockerfile
    container_name: brewgis_local_postgres
    command:
      postgres
        -c work_mem=256MB -c shared_buffers=4GB -c effective_cache_size=12GB -c maintenance_work_mem=512MB
        -c max_parallel_workers_per_gather=6 -c max_parallel_workers=8
        -c parallel_tuple_cost=0.1 -c parallel_setup_cost=10
        -c wal_buffers=64MB -c max_wal_size=4GB -c min_wal_size=1GB
        -c max_connections=40
        -c random_page_cost=1.1 -c effective_io_concurrency=200 -c default_statistics_target=500

    shm_size: '4gb'
    ports:
      - '5432:5432'
    volumes:
      - brewgis_local_postgres_data:/var/lib/postgresql
      - brewgis_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  tipg:
    image: ghcr.io/developmentseed/tipg:latest
    container_name: brewgis_local_tipg
    environment:
      PORT: 8081
      TIPG_DEBUG: "True"
      TIPG_ROOT_PATH: /tipg
      TIPG_DB_SCHEMAS: '["public", "tiger", "fresno_demo", "fresno"]'
      DATABASE_URL: postgresql://rADfmsnMjDXKephNGWFkfdPkuSAjdASF:glm5bKLmVKkfdJaM9qkDREdor4y8uSEJZKZvLVwP5jeEX6YSnw6DnNG9EYvupSlg@postgres:5432/brewgis
    ports:
      - 8081
    depends_on:
      - postgres

  martin:
    image: ghcr.io/maplibre/martin:1.8.2
    container_name: brewgis_local_martin
    # -c points at a config file (see compose/local/martin/config.yaml)
    # instead of using --default-srid/etc. as CLI flags, because we need
    # to override source_id_format to "{schema}.{table}" — brewgis
    # addresses tile sources that way, but Martin's zero-config default is
    # a bare table name (see the config file's own comments for why).
    #
    # --cache-size 0 disables Martin's own internal tile cache. Martin
    # caches rendered tile bytes keyed by (source, z, x, y) — it doesn't
    # look at the request's query string at all — so a scenario's paint
    # operations (which mutate the canvas view's underlying data, not its
    # schema) were invisible on the map for any tile Martin had already
    # served once: verified directly, painting a feature and re-requesting
    # its exact tile from Martin returned byte-identical, unchanged content
    # (same ETag) even though the view's own SQL returned the new value.
    # Every layer here is served from either a small/cheap table or a plain
    # (non-materialized) view meant to reflect live edits, so there's
    # nothing worth caching at this layer — correctness matters more than
    # shaving a query.
    command: --base-path /martin -c /martin-config/config.yaml --cache-size 0
    environment:
      DATABASE_URL: postgresql://rADfmsnMjDXKephNGWFkfdPkuSAjdASF:glm5bKLmVKkfdJaM9qkDREdor4y8uSEJZKZvLVwP5jeEX6YSnw6DnNG9EYvupSlg@postgres:5432/brewgis
    volumes:
      - ./compose/local/martin:/martin-config:ro
    ports:
      - 3000
    depends_on:
      - postgres

  redis:
    image: docker.io/redis:6
    container_name: brewgis_local_redis

    volumes:
      - brewgis_local_redis_data:/data


  celeryworker:
    <<: *django
    container_name: brewgis_local_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    container_name: brewgis_local_celerybeat
    depends_on:
      - redis
      - postgres
    command: /start-celerybeat

  flower:
    <<: *django
    container_name: brewgis_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
  mcp:
    <<: *django
    container_name: brewgis_local_mcp
    depends_on:
      - redis
      - postgres
    ports:
      - '8002:8002'
    command: /start-mcp
  sqlmesh-ui:
    <<: *django
    container_name: brewgis_local_sqlmesh_ui
    depends_on:
      - postgres
    ports:
      - '8001:8001'
    command: /start-sqlmesh-ui
